<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="The reward is outward">
<title>celloid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#08090A;
  --rule:#262B30;
  --label:#7E868E;
  --type:#E6E9EB;
  --interface:#4FB4FF;
  --interface-dim:rgba(79,180,255,.14);

  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

*{box-sizing:border-box;}

html{background:var(--void);-webkit-text-size-adjust:100%;}

body{
  margin:0;
  min-height:100dvh;
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(28px,6vw,76px);
  font-family:var(--sans);
  font-weight:400;
  line-height:1.55;
  color:var(--type);
  background:var(--void);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

h1{
  font-family:var(--mono);
  font-size:.82rem;font-weight:500;
  letter-spacing:.32em;
  color:var(--label);
  margin:0 0 30px;
}

p{
  font-size:clamp(2.1rem,8vw,5.2rem);
  font-weight:500;
  letter-spacing:-.045em;
  line-height:.94;
  white-space:nowrap;
  margin:0;
}

a{
  align-self:flex-start;
  margin:clamp(30px,6vh,64px) 0;
  color:var(--interface);
  text-decoration:none;
  border-bottom:1px solid var(--interface-dim);
  transition:border-color .2s;
}
a:hover{border-bottom-color:var(--interface);}
a:focus-visible{outline:2px solid var(--interface);outline-offset:3px;}
</style>
</head>
<body>

<h1>celloid</h1>
<p>cells for droids</p>
<a href="mailto:info@celloid.com" title="Learn more">info@celloid.com</a>

</body>
</html>
